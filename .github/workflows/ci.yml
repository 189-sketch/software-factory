name: ci
on:
    push:
        branches: [main, master, fix/typesafe-official-contract]
    pull_request:

# The factory runs exclusively in `llm mode`; tests use the built-in echo
# adapter (FACTORY_MODEL_ADAPTER=echo) to assert routing without burning
# real LLM credits. Tests that need a real LLM are skipped on forks.
jobs:
    test-fast:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'

            - name: Install factory CLI deps
              run: npm ci

            - name: Install control panel deps
              run: npm ci --prefix control-panel

            - name: Build factory orchestrator + skills
              run: npm run build:factory

            - name: Typecheck
              run: |
                  npx tsc --noEmit
                  npx tsc -p control-panel/tsconfig.json --noEmit

            - name: Workflow + signal-forward tests
              run: npm run test:fast

            - name: Daemon freshness and quality telemetry smoke
              run: node --test test/freshness-poc-cli.test.mjs

    test-full:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
            - run: npm ci
            - run: npm ci --prefix control-panel
            - run: npm audit --audit-level=moderate
            - run: node test/fixtures/esbuild-origin-probe.mjs
            - run: npm test
            - run: npm run spec-check

    test-package:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
            - run: npm ci
            - run: npm ci --prefix control-panel
            - run: npm run test:cli

    publish:
        # npm publish dry-run on every main push to make sure the tarball
        # is still valid. Real publish is a separate manual workflow.
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        needs: [test-fast, test-full, test-package]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.19.0'
            - run: npm ci
            - run: npm ci --prefix control-panel
            - run: npm run build
            - name: Build publishable tarball
              id: pack
              run: echo "tarball=$(npm pack --json | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"
            - name: Smoke-install tarball
              run: |
                  mkdir -p /tmp/factory-smoke
                  cd /tmp/factory-smoke
                  npm init -y >/dev/null 2>&1
                  npm install --no-audit --no-fund "${{ github.workspace }}/${{ steps.pack.outputs.tarball }}"
                  npx factory --help | head -5
