name: ci
on:
    push:
        branches: [main, master]
    pull_request:

# The factory runs exclusively in `llm mode`; tests use the built-in echo
# adapter (FACTORY_MODEL_ADAPTER=echo) to assert routing without burning
# real LLM credits. Tests that need a real LLM are skipped on forks.
jobs:
    test-fast:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install factory CLI deps
              run: npm ci

            - name: Build factory orchestrator + skills
              run: npm run build:factory

            - name: Typecheck
              run: |
                  npx tsc --noEmit
                  npx tsc -p control-panel/tsconfig.json --noEmit

            - name: Workflow + signal-forward tests
              run: npm run test:fast

    publish:
        # npm publish dry-run on every main push to make sure the tarball
        # is still valid. Real publish is a separate manual workflow.
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        needs: [test-fast]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - run: npm ci
            - run: npm run build
            - name: Build publishable tarball
              id: pack
              run: echo "tarball=$(npm pack --json | jq -r '.[0].filename')" >> "$GITHUB_OUTPUT"
            - name: Smoke-install tarball
              run: |
                  mkdir -p /tmp/factory-smoke
                  cd /tmp/factory-smoke
                  npm init -y >/dev/null 2>&1
                  npm install --no-audit --no-fund "${{ github.workspace }}/${{ steps.pack.outputs.tarball }}"
                  npx factory --help | head -5
                  npx factory-panel --help 2>&1 | head -3 || true
