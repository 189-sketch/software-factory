name: Improve Review Guidance

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

jobs:
  improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-audit --no-fund software-factory-cli@__FACTORY_VERSION__
      - name: Run real feedback improvement agent
        env:
          FACTORY_GH_REPO: ${{ github.repository }}
          FACTORY_REMOTE_PATH: https://github.com/${{ github.repository }}.git
          FACTORY_STATE_DIR: ${{ runner.temp }}/factory-state
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/issue.json",JSON.stringify({number:0,title:"Daily review feedback improvement",body:"Analyze human review feedback from the last 24 hours.",labels:[],author:"factory",url:"",createdAt:new Date().toISOString(),comments:[]}))'
          node node_modules/software-factory-cli/dist/factory/run-issue.js --stage improve-review-pr --issue "$RUNNER_TEMP/issue.json"
