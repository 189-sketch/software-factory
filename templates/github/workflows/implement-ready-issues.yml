name: Implement Ready Issues

on:
  issues:
    types: [labeled]

concurrency:
  group: factory-impl-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready-to-implement'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-audit --no-fund software-factory-cli@__FACTORY_VERSION__
      - name: Load complete issue context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          OUT: ${{ runner.temp }}/issue.json
        run: |
          gh issue view "$NUMBER" --repo "$REPO" --json number,title,body,labels,author,createdAt,url,comments > "$RUNNER_TEMP/raw-issue.json"
          node -e 'const fs=require("fs");const x=require(process.env.RUNNER_TEMP+"/raw-issue.json");x.labels=x.labels.map(v=>v.name);x.author=x.author.login;x.comments=x.comments.map(v=>({author:v.author.login,body:v.body,createdAt:v.createdAt}));fs.writeFileSync(process.env.OUT,JSON.stringify(x))'
      - name: Run real implementation, review and verification agents
        env:
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FACTORY_TRUSTED_EXECUTION: "1"
          FACTORY_STATE_DIR: ${{ runner.temp }}/factory-state
          FACTORY_GH_REPO: ${{ github.repository }}
          FACTORY_REMOTE_PATH: https://github.com/${{ github.repository }}.git
          FACTORY_VERIFY_URL: ${{ secrets.FACTORY_VERIFY_URL }}
          FACTORY_VERIFY_COMMAND: ${{ vars.FACTORY_VERIFY_COMMAND }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GH_TOKEN: ${{ github.token }}
        run: node node_modules/software-factory-cli/dist/factory/run-issue.js --issue "$RUNNER_TEMP/issue.json"
