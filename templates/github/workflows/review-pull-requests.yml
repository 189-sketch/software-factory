name: Review Pull Requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-audit --no-fund software-factory-cli@__FACTORY_VERSION__
      - name: Prepare trusted review inputs
        env:
          EVENT_PATH: ${{ github.event_path }}
          OUT: ${{ runner.temp }}/issue.json
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff -U3 "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/raw-diff.txt"
          node node_modules/software-factory-cli/scripts/annotate-diff.mjs --input "$RUNNER_TEMP/raw-diff.txt" --output "$RUNNER_TEMP/pr_diff.txt"
          node -e 'const fs=require("fs");const path=require("path");const e=require(process.env.EVENT_PATH);const p=e.pull_request;const dir=process.env.RUNNER_TEMP;fs.writeFileSync(process.env.OUT,JSON.stringify({number:p.number,title:p.title,body:p.body||"",labels:[],author:p.user.login,url:p.html_url,createdAt:p.created_at,comments:[]}));fs.writeFileSync(path.join(dir,"pr_description.txt"),p.body||"")'
      - name: Run real code review agent
        env:
          FACTORY_REVIEW_DIR: ${{ runner.temp }}
          FACTORY_STATE_DIR: ${{ runner.temp }}/factory-state
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: node node_modules/software-factory-cli/dist/factory/run-issue.js --stage review-pr --issue "$RUNNER_TEMP/issue.json"
      - run: node node_modules/software-factory-cli/scripts/validate-review.mjs
      - name: Publish structured review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERDICT=$(jq -r '.verdict' "$RUNNER_TEMP/review.json")
          if [ "$VERDICT" = APPROVE ]; then EVENT=APPROVE; else EVENT=REQUEST_CHANGES; fi
          jq --arg event "$EVENT" --arg commit_id "$HEAD_SHA" '{body,event:$event,commit_id:$commit_id,comments:[.comments[] | with_entries(select(.key == "path" or .key == "line" or .key == "side" or .key == "body" or .key == "start_line" or .key == "start_side"))]}' "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/review-payload.json"
          gh api --method POST "repos/$REPO/pulls/$NUMBER/reviews" --input "$RUNNER_TEMP/review-payload.json"
