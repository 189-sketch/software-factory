name: Triage Issues

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event_name == 'issues' || (contains(github.event.issue.labels.*.name, 'needs-info') && github.event.comment.user.type == 'User')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund software-factory-cli@__FACTORY_VERSION__
      - name: Acquire cross-scheduler issue lease
        id: lease
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_GH_REPO: ${{ github.repository }}
          FACTORY_STATE_WRITERS: ${{ vars.FACTORY_STATE_WRITERS || 'github-actions[bot]' }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node node_modules/software-factory-cli/scripts/factory-lease.mjs acquire --issue "${{ github.event.issue.number }}" --receipt "$RUNNER_TEMP/factory-lease.json"
      - name: Load complete issue context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          OUT: ${{ runner.temp }}/issue.json
        run: |
          gh issue view "$NUMBER" --repo "$REPO" --json number,title,body,labels,author,createdAt,url,comments > "$RUNNER_TEMP/raw-issue.json"
          node -e 'const fs=require("fs");const x=require(process.env.RUNNER_TEMP+"/raw-issue.json");x.labels=x.labels.map(v=>v.name);x.author=x.author.login;x.comments=x.comments.map(v=>({author:v.author.login,body:v.body,createdAt:v.createdAt}));fs.writeFileSync(process.env.OUT,JSON.stringify(x))'
      - name: Run real triage agent
        id: agent
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_SYNC_LABELS: "1"
          FACTORY_STATE_DIR: ${{ runner.temp }}/factory-state
          FACTORY_GH_REPO: ${{ github.repository }}
          FACTORY_STATE_WRITERS: ${{ vars.FACTORY_STATE_WRITERS || 'github-actions[bot]' }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          node node_modules/software-factory-cli/dist/factory/run-issue.js --lease-receipt "$RUNNER_TEMP/factory-lease.json" \
            --stage triage \
            --issue "$RUNNER_TEMP/issue.json" \
            --output-file "$RUNNER_TEMP/triage-result.json"
          echo "result=$(cat "$RUNNER_TEMP/triage-result.json")" >> "$GITHUB_OUTPUT"
      - name: Release cross-scheduler issue lease
        if: always() && steps.lease.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_GH_REPO: ${{ github.repository }}
          FACTORY_STATE_WRITERS: ${{ vars.FACTORY_STATE_WRITERS || 'github-actions[bot]' }}
          FACTORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node node_modules/software-factory-cli/scripts/factory-lease.mjs release --issue "${{ github.event.issue.number }}" --receipt "$RUNNER_TEMP/factory-lease.json"
